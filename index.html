<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silver Loss Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen py-8 px-4">
  <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-lg p-6">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold text-center w-full" id="title">Silver Loss Calculator - Total Battle</h1>
      <select id="languageSelector" class="ml-4 p-1 border rounded text-sm w-32">
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
    </div>

    <div class="grid md:grid-cols-3 gap-4 mb-6">
      <div>
        <label class="block font-semibold mb-1" id="labelTroopType">Troop Type</label>
        <select id="tipoTropa" class="w-full border rounded p-2"></select>
      </div>

      <div>
        <label class="block font-semibold mb-1" id="labelLevel">Level</label>
        <input id="nivelTropa" type="number" min="1" max="15" class="w-full border rounded p-2" placeholder="E.g.: 4">
      </div>

      <div>
        <label class="block font-semibold mb-1" id="labelAmount">Death Count</label>
        <input id="cantidad" type="number" min="1" class="w-full border rounded p-2" placeholder="E.g.: 1000">
      </div>
    </div>

    <button onclick="agregarFila()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded mb-4" id="addBtn">Add</button>

    <table class="w-full table-auto text-sm mb-4">
      <thead>
        <tr class="bg-gray-200">
          <th class="px-2 py-1" id="thType">Type</th>
          <th class="px-2 py-1" id="thLevel">Level</th>
          <th class="px-2 py-1" id="thAmount">Amount</th>
          <th class="px-2 py-1" id="thCost">Cost/Unit</th>
          <th class="px-2 py-1" id="thSubtotal">Subtotal</th>
          <th class="px-2 py-1" id="thDelete">Delete</th>
        </tr>
      </thead>
      <tbody id="tabla"></tbody>
    </table>

    <div class="text-right font-bold text-xl mb-4">
      <span id="totalText">Total Silver:</span> <span id="total">0</span>
    </div>

    <div class="text-center">
      <button onclick="reiniciarTodo()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded" id="resetBtn">Reset</button>
    </div>
  </div>

  <script>
    const translations = {
      en: {
        title: "Silver Loss Calculator - Total Battle",
        troopType: "Troop Type",
        level: "Level",
        amount: "Death Count",
        add: "Add",
        type: "Type",
        cost: "Cost/Unit",
        subtotal: "Subtotal",
        delete: "Delete",
        total: "Total Silver:",
        reset: "Reset",
        alert: "Please complete all fields correctly.",
        placeholderLevel: "E.g.: 4",
        placeholderAmount: "E.g.: 1000"
      },
      es: {
        title: "Calculadora de Pérdidas de Plata - Total Battle",
        troopType: "Tipo de Tropa",
        level: "Nivel",
        amount: "Cantidad de Muertes",
        add: "Agregar",
        type: "Tipo",
        cost: "Costo/U.",
        subtotal: "Subtotal",
        delete: "Eliminar",
        total: "Total en Plata:",
        reset: "Reiniciar",
        alert: "Por favor completa todos los campos correctamente.",
        placeholderLevel: "Ej.: 4",
        placeholderAmount: "Ej.: 1000"
      }
    };

    const costosTropas = {
      "MERCENARY GUARD": 120,
      "MERCENARY MONSTER": 3,
      "WALL": 200,
      "CATAPULTS": 200,
      "GRIFFINS": 800,
      "RIDERS": 80,
      "SPEARMEN": 40,
      "ARCHERS": 40,
      "SPECIALISTS": 80,
      "SPEARMAN": 40,
      "CAPTAIN I": 1000,
      "CAPTAIN II": 1000,
      "CAPTAIN III": 1000,
      "HERO": 1500,
      "TAR": 500,
      "GOLD": 1000,
      "PORTAL": 2000000,
      "FORT": 5000000,
      "CAPITAL": 10000000,
      "DM/WS": 5000000,
      "RRS": 200000,
      "MONSTERS III": 1300,
      "MONSTERS IV": 2400,
      "MONSTERS V": 3520,
      "MONSTERS VI": 4800,
      "MONSTERS VII": 7040,
      "MONSTER I": 8540,
      "MONSTERS II": 8640
    };

    const tipoTropa = document.getElementById("tipoTropa");
    const tabla = document.getElementById("tabla");
    const totalSpan = document.getElementById("total");
    const selector = document.getElementById("languageSelector");
    let total = 0;
    let lang = "en";

    function cargarTropas() {
      tipoTropa.innerHTML = '<option value="">Select...</option>';
      Object.keys(costosTropas).forEach(tipo => {
        const option = document.createElement("option");
        option.value = tipo;
        option.textContent = tipo;
        tipoTropa.appendChild(option);
      });
    }

    function aplicarIdioma(idioma) {
      lang = idioma;
      const t = translations[idioma];
      document.getElementById("title").textContent = t.title;
      document.getElementById("labelTroopType").textContent = t.troopType;
      document.getElementById("labelLevel").textContent = t.level;
      document.getElementById("labelAmount").textContent = t.amount;
      document.getElementById("addBtn").textContent = t.add;
      document.getElementById("thType").textContent = t.type;
      document.getElementById("thLevel").textContent = t.level;
      document.getElementById("thAmount").textContent = t.amount;
      document.getElementById("thCost").textContent = t.cost;
      document.getElementById("thSubtotal").textContent = t.subtotal;
      document.getElementById("thDelete").textContent = t.delete;
      document.getElementById("totalText").textContent = t.total;
      document.getElementById("resetBtn").textContent = t.reset;
      document.getElementById("nivelTropa").placeholder = t.placeholderLevel;
      document.getElementById("cantidad").placeholder = t.placeholderAmount;
    }

    function agregarFila() {
      const tipo = tipoTropa.value;
      const nivel = document.getElementById("nivelTropa").value;
      const cantidad = parseInt(document.getElementById("cantidad").value);

      if (!tipo || !nivel || !cantidad || cantidad <= 0) {
        alert(translations[lang].alert);
        return;
      }

      const costo = costosTropas[tipo];
      const subtotal = costo * cantidad;
      total += subtotal;
      totalSpan.textContent = total.toLocaleString();

      const fila = document.createElement("tr");
      fila.innerHTML = `
        <td class="border px-2 py-1">${tipo}</td>
        <td class="border px-2 py-1">${nivel}</td>
        <td class="border px-2 py-1">${cantidad.toLocaleString()}</td>
        <td class="border px-2 py-1">${costo.toLocaleString()}</td>
        <td class="border px-2 py-1">${subtotal.toLocaleString()}</td>
        <td class="border px-2 py-1 text-center">
          <button onclick="eliminarFila(this, ${subtotal})" class="text-red-600 hover:text-red-800">❌</button>
        </td>
      `;
      tabla.appendChild(fila);

      document.getElementById("nivelTropa").value = "";
      document.getElementById("cantidad").value = "";
    }

    function eliminarFila(btn, subtotal) {
      btn.parentElement.parentElement.remove();
      total -= subtotal;
      totalSpan.textContent = total.toLocaleString();
    }

    function reiniciarTodo() {
      tabla.innerHTML = "";
      total = 0;
      totalSpan.textContent = "0";
    }

    selector.addEventListener("change", () => aplicarIdioma(selector.value));

    // Inicialización
    cargarTropas();
    aplicarIdioma("en");
  </script>
</body>
</html>
